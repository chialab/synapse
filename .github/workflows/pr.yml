name: Pull Request
on:
  pull_request:
    types: [opened, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - name: Run build script
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - name: Install chromium
        run: pnpm playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

